<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive English vocabulary trainer." >

    <title>English Vocabulary Trainer</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <main class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar__header">
                <h2 class="sidebar__title" id="options-title"> </h2>
            </div>

            <!-- LANGUAGE -->
            <section class="option">
                <p class="option__status" id="language-status"> </p>
                <button class="option__button" id="language-button" type="button"> </button>
            </section>

            <!-- LEVEL -->
            <section class="option">
                <p class="option__status" id="level-status"> </p>
                <button class="option__button" id="level-button" type="button"> </button>
            </section>

            <!-- CATEGORY -->
            <section class="option">
                <p class="option__status" id="category-status"> </p>
                <button class="option__button" id="category-button" type="button"> </button>
            </section>

            <!-- STATISTICS -->
            <section class="stats-card">
                <div class="stats-card__header">
                    <span>📊</span>
                    <span id="score-title"> </span>
                </div>

                <div class="progress">
                    <div class="progress__bar" id="progress-bar"> </div>
                </div>

                <p class="stats-card__progress" id="progress-text"> </p>

                <div class="stats-card__data">
                    <p class="stats-card__correct" id="correct-count"> </p>
                    <p class="stats-card__incorrect" id="incorrect-count"> </p>
                    <p id="round-count"> </p>
                </div>
            </section>
        </aside>


        <!-- MAIN CONTENT -->
        <section class="main-content">
            <header class="main-content__header">

                <!-- INTERFACE LANGUAGE -->
                <div class="interface-language">
                    <span class="interface-language__label" id="interface-language-label" > </span>

                    <div class="interface-language__buttons">
                        <button class="interface-language__button" type="button" data-interface-language="en" aria-label="English interface">
                            EN
                        </button>
                        <button class="interface-language__button" type="button" data-interface-language="es" aria-label="Spanish interface">
                            ES
                        </button>
                    </div>
                </div>

                <!-- TITLE -->
                <h1 id="app-title"></h1>
                <p class="main-content__message" id="main-message"> </p>
            </header>

            <!-- DYNAMIC CONTENT -->
            <div class="game-content" id="game-content">
                <!-- LANGUAGE SELECTION                            -->
                <div class="practice-step" id="language-selection">
                    <div class="language-options">
                        <button class="button button--primary" type="button" data-language="random"> </button>
                        <button class="button button--primary" type="button" data-language="en"> </button>
                        <button class="button button--primary" type="button" data-language="es"> </button>
                    </div>
                </div>

                <!-- LEVEL SELECTION                              -->
                <div class="practice-step" id="level-selection" hidden>
                    <div class="level-options" id="level-options"> <!-- Los botones de nivel se generan mediante JS --> </div>
                </div>

                <!-- CATEGORY SELECTION -->
                <div class="practice-step" id="category-selection" hidden>
                    <div class="category-options" id="category-options"> </div>
                </div>

                <!-- IRREGULAR VERBS SELECTION -->
                <div class="practice-step" id="irregular-verbs-selection" hidden>
                    <div class="irregular-verbs-options" id="irregular-verbs-options">
                        <button class="button button-category" type="button" data-irregular-mode="random">
                            Irregular Verbs Random
                        </button>

                        <button class="button button-category" type="button" data-irregular-mode="tenses">
                            Irregular Verbs by Tenses
                        </button>
                    </div>
                </div>

                <!-- VOCABULARY PRACTICE                     -->
                <div class="practice-step" id="vocabulary-practice" hidden>
                    <p id="translation-instructions" class="translation-instructions"></p>
                    <div class="question">
                        <p class="question__progress" id="question-progress"></p>
                        <div class="question__body">
                            <h2 class="question__word" id="question-word"></h2>
                            <!-- ANSWER -->
                            <div class="answer">
                                <input class="answer-input" id="answer-input" type="text" autocomplete="off">
                                <button class="button button-ans" id="answer-button" type="button"></button>
                            </div>
                        </div>
                        <!-- FEEDBACK -->
                        <p class="answer-feedback" id="answer-feedback"> </p>
                    </div>
                </div>
                <!-- IRREGULAR VERBS BY TENSES PRACTICE -->
                <div class="practice-step" id="irregular-tenses-practice" hidden>
                    <div class="question">
                        <p class="question__progress" id="irregular-question-progress"></p>
                        <div class="irregular-tenses-grid" id="irregular-tenses-grid"></div>
                        <p class="answer-feedback" id="irregular-answer-feedback"> </p>
                        <button class="button button-ans" id="irregular-answer-button" type="button"> </button>
                    </div>
                </div>
                <!-- PRACTICE RESULT -->
                <div id="practice-result" class="practice-result" hidden>
                    <h2 id="practice-result-title"></h2>
                    <p id="practice-result-score"></p>
                    <p id="practice-result-stats"></p>
                    <button id="back-to-start-button" type="button" class="button"></button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/language.js"></script>
    <script src="js/level.js"></script>
    <script src="js/category.js"></script>
    
    <!-- PRACTICE -->
    <script src="js/practice/practice-state.js"></script>
    <script src="js/practice/practice-question.js"></script>
    <script src="js/practice/practice-stats.js"></script>
    <script src="js/practice/practice-feedback.js"></script>
    <script src="js/practice/practice-ui.js"></script>
    <script src="js/practice/practice-vocabulary.js"></script>
    <script src="js/practice/practice-irregular.js"></script>
    <script src="js/practice/practice-init.js"></script>
    <script src="js/practice/practice.js"></script>

    <script src="js/app.js"></script>
</body>


</html>
